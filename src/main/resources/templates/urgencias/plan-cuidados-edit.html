<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Plan de Cuidados</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
            color: #111827;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px 24px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 {
            margin: 0;
            font-size: 18px;
        }
        h2 {
            font-size: 14px;
            margin: 18px 0 10px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid #e5e7eb;
            color: #1f2937;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 12px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            padding: 7px 9px;
            border: 1px solid #9ca3af;
            border-radius: 5px;
            font-size: 13px;
        }
        .checks {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 6px;
        }
        .check-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }
        .actions {
            margin-top: 22px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn {
            padding: 9px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary { background: #1d4ed8; color: #fff; }
        .btn-outline { background: #e5e7eb; color: #111827; }
        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 14px;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="container">

    <div class="top-bar">
        <div>
            <h1>Editar Plan de Cuidados Diario</h1>
            <small th:text="'Plan #' + ${plan.idPlanCuidados} + ' | Fecha: ' + ${plan.fechaPlan}"></small>
        </div>
        <a th:href="@{/urgencias/plan-cuidados/{id}/imprimir(id=${plan.idPlanCuidados})}"
           target="_blank"
           class="btn btn-outline">
            Ver Vista de Impresión
        </a>
    </div>

    <div th:if="${mensajeExito}" class="alert-success" th:text="${mensajeExito}"></div>

    <form th:action="@{/urgencias/plan-cuidados/{id}/editar(id=${plan.idPlanCuidados})}"
          th:object="${plan}"
          method="post">

        <!-- Paciente e Ingreso -->
        <h2>Datos del Paciente e Ingreso</h2>
        <div class="grid-3">
            <div class="field">
                <label>Historia Clínica</label>
                <input type="text" th:field="*{paciente.historiaClinica}">
            </div>
            <div class="field">
                <label>Nombres</label>
                <input type="text" th:field="*{paciente.nombres}">
            </div>
            <div class="field">
                <label>Apellidos</label>
                <input type="text" th:field="*{paciente.apellidos}">
            </div>
            <div class="field">
                <label>N.° Ingreso</label>
                <input type="text" th:field="*{ingreso.numeroIngreso}">
            </div>
            <div class="field">
                <label>Cama</label>
                <input type="text" th:field="*{ingreso.cama}">
            </div>
            <div class="field">
                <label>Peso (kg)</label>
                <input type="text" th:field="*{ingreso.peso}">
            </div>
        </div>
        <div class="field" style="margin-top: 10px;">
            <label>Diagnóstico de Ingreso</label>
            <input type="text" th:field="*{ingreso.diagnosticoIngreso}">
        </div>

        <!-- Dominios y Riesgos -->
        <h2>Dominios NANDA, Riesgos y Comentarios</h2>
        <div class="grid-2">
            <div class="field">
                <label>Nivel de Riesgo de Lesión en Piel</label>
                <select th:field="*{dominiosRiesgos.lesionPielNivel}">
                    <option value="Bajo">Bajo</option>
                    <option value="Medio">Medio</option>
                    <option value="Alto">Alto</option>
                </select>
            </div>
            <div class="field">
                <label>Comentarios Generales</label>
                <input type="text" th:field="*{dominiosRiesgos.comentarios}">
            </div>
        </div>

        <!-- Dietas y Frecuencias -->
        <h2>Dietas y Frecuencia de Monitoreo</h2>
        <div class="grid-2">
            <div class="field">
                <label>Dieta Indicada</label>
                <input type="text" th:field="*{dietasFrecuencia.dietaIndicada}">
            </div>
            <div class="field">
                <label>Soporte de Oxígeno</label>
                <input type="text" th:field="*{dietasFrecuencia.soporteOxigeno}">
            </div>
        </div>

        <div class="checks">
            <label class="check-item">
                <input type="checkbox" th:field="*{dietasFrecuencia.dejarCena}"> Dejar cena
            </label>
            <label class="check-item">
                <input type="checkbox" th:field="*{dietasFrecuencia.asistida}"> Asistida
            </label>
            <label class="check-item">
                <input type="checkbox" th:field="*{dietasFrecuencia.oxigenoterapiaActivo}"> Oxigenoterapia activa
            </label>
        </div>

        <div class="grid-2" style="margin-top: 12px;">
            <div class="field">
                <label>Signos Vitales cada (h)</label>
                <input type="number" min="1" th:field="*{dietasFrecuencia.frecuenciaMonitoreo.signosVitalesCada}">
            </div>
            <div class="field">
                <label>Curva de Temperatura cada (h)</label>
                <input type="number" min="1" th:field="*{dietasFrecuencia.frecuenciaMonitoreo.curvaTempCada}">
            </div>
            <div class="field">
                <label>Glasgow cada (h)</label>
                <input type="number" min="1" th:field="*{dietasFrecuencia.frecuenciaMonitoreo.glasgowCada}">
            </div>
            <div class="field">
                <label>Posición</label>
                <select th:field="*{dietasFrecuencia.frecuenciaMonitoreo.posicion}">
                    <option value="Decúbito supino">Decúbito supino</option>
                    <option value="Fowler / Semi-Fowler (30° - 45°)">Fowler / Semi-Fowler (30° - 45°)</option>
                    <option value="Decúbito Lateral Derecho">Decúbito Lateral Derecho</option>
                    <option value="Decúbito Lateral Izquierdo">Decúbito Lateral Izquierdo</option>
                    <option value="Decúbito Dorsal">Decúbito Dorsal</option>
                </select>
            </div>
        </div>

        <!-- Seguridad, Movilización y Sondas -->
        <h2>Movilización y Sonda Vesical</h2>
        <div class="checks">
            <label class="check-item">
                <input type="checkbox" th:field="*{seguridadMovilizacion.movilizarCama}"> Movilizar en cama
            </label>
            <label class="check-item">
                <input type="checkbox" th:field="*{seguridadMovilizacion.movilizarSilla}"> C-Silla
            </label>
            <label class="check-item">
                <input type="checkbox" th:field="*{seguridadMovilizacion.movilizarDeambular}"> Deambular
            </label>
            <label class="check-item">
                <input type="checkbox" th:field="*{cuidadosSondas.sondaVesicalActivo}"> Sonda vesical activa
            </label>
        </div>

        <div class="field" style="margin-top: 10px; max-width: 280px;">
            <label>Cateterismo vesical cada</label>
            <input type="text" th:field="*{cuidadosSondas.cateterismoCadaHoras}">
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
    </form>
</div>
</body>
</html>
